<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

body{
    background:#000;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:#111;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:350px;
    border:2px solid gold;
    box-shadow:0 0 20px rgba(255,215,0,0.5);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:red;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:gold;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

</style>

</head>

<body>

<div class="login-box">

    <h1>LOGIN</h1>

    <select id="role">

        <option value="user">
            USER
        </option>

        <option value="admin">
            ADMIN
        </option>

    </select>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="login()">
        LOGIN
    </button>

</div>

<script src="login.js"></script>

</body>
</html>
