<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">ADMIN PANEL</h1>

<div style="margin-top:40px;">

<input type="number" id="saldoInput" placeholder="Tambah saldo">

<button onclick="tambahSaldo()">
Tambah Saldo
</button>

<button onclick="resetSaldo()">
Reset
</button>
<div style="margin-top:30px;">

<h2>MODE DEMO</h2>

<select id="demoMode">

    <option value="normal">
        NORMAL MODE
    </option>

    <option value="lucky">
        LUCKY MODE
    </option>

    <option value="hard">
        HARD MODE
    </option>

</select>

<button onclick="saveMode()">
SAVE MODE
</button>
    
</div>

<div class="result" id="adminResult"></div>

<script src="admin.js"></script>

<script>

if(localStorage.getItem("loginRole") !== "admin"){

    window.location.href =
        "login.html";

}

</script>
</body>
</html>
